<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76" fill="none">
  <!-- Monograma Técnico FEU -->
  <g transform="translate(4, 8)">
    <!-- Letra F estilizada como estrutura geométrica -->
    <path d="M0 60 L0 0 L42 0 L42 12 L14 12 L14 24 L34 24 L34 36 L14 36 L14 60 Z" fill="#0A192F"/>
    <!-- Detalhes em Laranja da Engenharia -->
    <rect x="46" y="0" width="12" height="12" fill="#F26419"/>
    <rect x="38" y="24" width="12" height="12" fill="#F26419"/>
    <!-- Linha de Nível / Esquadro Azul -->
    <line x1="0" y1="62" x2="58" y2="62" stroke="#0F52BA" stroke-width="3" stroke-linecap="round"/>
    <circle cx="58" cy="62" r="3.5" fill="#F26419"/>
  </g>

  <!-- Tipografia FEU -->
  <text x="78" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" letter-spacing="1" fill="#0A192F">
    FEU
  </text>

  <!-- Subtítulo Corporativo -->
  <text x="80" y="60" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" letter-spacing="3.5" fill="#F26419">
    ENGENHARIA
  </text>
  <text x="182" y="60" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="2.8" fill="#0F52BA">
    &amp; SOLUÇÕES
  </text>
</svg>